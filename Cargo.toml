[workspace]
members = ["crates/ap", "crates/kpi-producer"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }

rustix = { version = "=1.1.2", default-features = false, features = ["std", "fs", "process", "param", "termios"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

rusqlite = { version = "=0.32.1", default-features = false, features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
