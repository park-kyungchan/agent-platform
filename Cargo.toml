[workspace]
members = ["crates/ap"]
# The Ontology engine (engine/) is a workspace of its own, with its own Cargo.lock and toolchain file.
exclude = ["engine"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }

rustix = { version = "=1.1.2", default-features = false, features = ["std", "fs"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"

[profile.mutants]
inherits = "test"
debug = "none"
