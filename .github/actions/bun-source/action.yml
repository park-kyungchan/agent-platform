name: Caller-owned Bun source checks
description: Run explicit package scripts in the caller checkout without importing common-root quality policy
inputs:
  project-id:
    description: Exact caller project.json projectId
    required: true
  repository:
    description: Exact caller owner/repository
    required: true
  source-sha:
    description: Exact caller checkout commit; caller chooses authored head or prospective merge
    required: true
  source-author-metadata:
    description: Required committed native source-author record; missing or mismatched metadata refuses before owner commands
    required: true
    default: .github/source-author.json
  bun-version:
    description: Exact owner-selected Bun version
    required: false
  bun-version-file:
    description: Caller-owned .bun-version file; use instead of bun-version
    required: false
  scripts:
    description: JSON array of existing caller package script names, in order
    required: true
  install-dependencies:
    description: Whether to run frozen installation with lifecycle scripts disabled
    default: "true"
runs:
  using: composite
  steps:
    - name: Resolve the caller exact runtime version before setup
      id: runtime
      shell: bash
      env:
        COMMON_CI_BUN_VERSION: ${{ inputs.bun-version }}
        COMMON_CI_BUN_VERSION_FILE: ${{ inputs.bun-version-file }}
        COMMON_CI_BUN_RESOLVER: ${{ github.action_path }}/../../../ci/reuse/resolve-bun-version.sh
      run: bash "$COMMON_CI_BUN_RESOLVER"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ steps.runtime.outputs.bun-version }}
    - name: Verify caller identity and run owner scripts
      shell: bash
      env:
        COMMON_CI_RUNNER: ${{ github.action_path }}/../../../ci/reuse/run.ts
        COMMON_CI_PROJECT_ID: ${{ inputs.project-id }}
        COMMON_CI_REPOSITORY: ${{ inputs.repository }}
        COMMON_CI_SOURCE_SHA: ${{ inputs.source-sha }}
        COMMON_CI_SOURCE_AUTHOR_METADATA: ${{ inputs.source-author-metadata }}
        COMMON_CI_BUN_VERSION: ${{ steps.runtime.outputs.bun-version }}
        COMMON_CI_SCRIPTS: ${{ inputs.scripts }}
        COMMON_CI_INSTALL: ${{ inputs.install-dependencies }}
      run: bun --no-env-file --no-install "$COMMON_CI_RUNNER"
