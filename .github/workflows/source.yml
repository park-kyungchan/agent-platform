name: VPS source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Reuse common CI pins; default PR checkout verifies its prospective merge.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test deterministic source contracts
        run: cargo test --locked
