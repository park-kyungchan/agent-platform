name: Source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Canonical source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify canonical source in finite owner QA tree
        run: bun ci/source-check.ts
  quality:
    name: Quality and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      artifact-digest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install exact source quality dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify source quality and architecture contract
        run: bun run check:quality
        env:
          QUALITY_REPORT_PATH: ${{ runner.temp }}/agent-platform-quality.json
      - name: Preserve bounded source quality evidence
        id: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-quality-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-platform-quality.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
  merge-integration:
    name: Prospective merge integration
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Default checkout retains this PR event's GitHub synthetic merge commit.
      # Authored-head source/quality/native-review checks remain separate jobs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify prospective merge in finite owner QA tree
        run: bun ci/source-check.ts
  native-review:
    name: Exact head native independent review
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe independent review status availability
        id: review-status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_REVIEW_STATUS_CREATOR_ID: ${{ vars.NATIVE_REVIEW_STATUS_CREATOR_ID }}
          NATIVE_REVIEW_STATUS_CREATOR_LOGIN: ${{ vars.NATIVE_REVIEW_STATUS_CREATOR_LOGIN }}
        with:
          retries: 0
          script: |
            const head = process.env.REVIEW_HEAD_SHA;
            const creator = process.env.NATIVE_REVIEW_STATUS_CREATOR_ID;
            const login = process.env.NATIVE_REVIEW_STATUS_CREATOR_LOGIN;
            if (!/^[a-f0-9]{40}$/.test(head ?? '') || !/^[1-9][0-9]*$/.test(creator ?? '')) {
              throw new Error('Exact review head and configured expected creator are required');
            }
            const response = await github.request('GET /repos/{owner}/{repo}/commits/{ref}/statuses', {
              ...context.repo, ref: head, per_page: 100,
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
            });
            if (!Array.isArray(response.data) || response.data.length >= 100) throw new Error('Review status page unavailable or exceeds the bounded page');
            const status = response.data.find(value => value.context === 'native-independent-review');
            if (status && (String(status.creator?.id) !== creator || (login && status.creator?.login !== login))) {
              throw new Error('Native review status has an unexpected creator');
            }
            if (status && !['success', 'pending'].includes(status.state)) throw new Error('Native review has failed or is invalid');
            core.setOutput('ready', Boolean(status && status.state === 'success'));
      # This exact failure marker is the observer's only retry admission.
      # Invalid creator/status/receipt failures use different steps and stay blocked.
      - name: Native review status not yet available
        if: ${{ steps.review-status.outputs.ready != 'true' }}
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Read immutable native review receipt for this exact head
        run: bun ci/source-check.ts --review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_REVIEW_STATUS_CREATOR_ID: ${{ vars.NATIVE_REVIEW_STATUS_CREATOR_ID }}
          NATIVE_REVIEW_STATUS_CREATOR_LOGIN: ${{ vars.NATIVE_REVIEW_STATUS_CREATOR_LOGIN }}
  source-gate:
    name: Source and native review gate
    if: ${{ always() }}
    needs: [source, quality, merge-integration, native-review]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      source-result: ${{ needs.source.result }}
      quality-result: ${{ needs.quality.result }}
      integration-result: ${{ needs.merge-integration.result }}
      review-result: ${{ needs.native-review.result }}
      quality-artifact-digest: ${{ needs.quality.outputs.artifact-digest }}
    steps:
      - name: Require source quality and exact head native review
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.merge-integration.result }}
          REVIEW_RESULT: ${{ needs.native-review.result }}
          QUALITY_ARTIFACT_DIGEST: ${{ needs.quality.outputs.artifact-digest }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$REVIEW_RESULT" = success
          test -n "$QUALITY_ARTIFACT_DIGEST"
          case "$EVENT_NAME:$INTEGRATION_RESULT" in
            pull_request:success|push:skipped|workflow_dispatch:skipped) ;;
            *) exit 1 ;;
          esac
