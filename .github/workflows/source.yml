name: Source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Canonical source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify canonical source in finite owner QA tree
        run: bun ci/source-check.ts
  native-review:
    name: Exact head native independent review
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Read immutable native review receipt for this exact head
        run: bun ci/source-check.ts --review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_REVIEW_STATUS_CREATOR_ID: ${{ vars.NATIVE_REVIEW_STATUS_CREATOR_ID }}
          NATIVE_REVIEW_STATUS_CREATOR_LOGIN: ${{ vars.NATIVE_REVIEW_STATUS_CREATOR_LOGIN }}
  source-gate:
    name: Source and native review gate
    if: ${{ always() }}
    needs: [source, native-review]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both source checks and exact head native review
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          REVIEW_RESULT: ${{ needs.native-review.result }}
        run: test "$SOURCE_RESULT" = success && test "$REVIEW_RESULT" = success
