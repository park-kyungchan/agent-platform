name: VPS source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Reuse common CI pins; default PR checkout verifies its prospective merge.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify tracked source boundary and immutable common package
        run: |
          bun scripts/ci/source-policy.ts
          bun scripts/ci/infrastructure-release.ts verify
      - name: Install exact self-contained source dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify native TypeScript and existing deterministic tests
        run: bun run check
      - name: Validate deployment syntax without lifecycle effects
        run: bun scripts/ci/deployment-syntax.ts --require-compose
