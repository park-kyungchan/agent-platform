name: Source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: "1"
  RUSTUP_TOOLCHAIN: "1.95.0"
jobs:
  source:
    name: Canonical source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust in the disposable runner
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Verify retained Rust and frozen finite conformance
        run: bash ci/check-rust-source.sh
  merge-integration:
    name: Prospective merge integration
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Default checkout tests this event's synthetic merge, separately from the authored head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust in the disposable runner
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Verify retained Rust and frozen finite conformance
        run: bash ci/check-rust-source.sh
