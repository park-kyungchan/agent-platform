name: Rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('rust-pr-{0}', github.ref) || format('rust-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply docs-only paths-ignore semantics inside the always-run job
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_rust=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':!docs/**' ':!README.md'; then
              run_rust=false
            fi
          fi
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
      - name: Check without a Rust build (documents only)
        if: steps.scope.outputs.run_rust != 'true'
        run: ./check content
      - name: Install repository-pinned Rust
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      - name: Restore the engine of ontology/ENGINE-PIN
        id: engine-cache
        if: steps.scope.outputs.run_rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/engine-pin/bin
          key: engine-pin-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ontology/ENGINE-PIN', 'rust-toolchain.toml') }}
      - name: Build the engine of ontology/ENGINE-PIN
        if: steps.scope.outputs.run_rust == 'true' && steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          ONTOLOGY_PLATFORM_DEPLOY_KEY: ${{ secrets.ONTOLOGY_PLATFORM_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$ONTOLOGY_PLATFORM_DEPLOY_KEY" ]; then
            echo "deploy_key_missing@.github/workflows/rust.yml" >&2
            exit 1
          fi
          # Two files of the checkout are read as data and validated; no file of the checkout is executed.
          pin=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/ontology/ENGINE-PIN")
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "engine_pin_invalid@.github/workflows/rust.yml" >&2
            exit 1
          fi
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' "$GITHUB_WORKSPACE/rust-toolchain.toml")
          if ! [[ "$channel" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "toolchain_invalid@.github/workflows/rust.yml" >&2
            exit 1
          fi
          export RUSTUP_TOOLCHAIN="$channel"
          umask 077
          tmp=
          trap '[ -z "$tmp" ] || rm -rf -- "$tmp"' EXIT
          tmp=$(mktemp -d)
          key_file="$tmp/key"
          known_hosts="$tmp/known-hosts"
          src="$tmp/src"
          printf '%s\n' "$ONTOLOGY_PLATFORM_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/meta | jq -r '.ssh_keys[]? | "github.com " + .' > "$known_hosts"
          if [ ! -s "$known_hosts" ]; then
            echo "github_ssh_keys_empty@.github/workflows/rust.yml" >&2
            exit 1
          fi
          ssh_command="ssh -i $(printf '%q' "$key_file") -o IdentitiesOnly=yes -o UserKnownHostsFile=$(printf '%q' "$known_hosts") -o StrictHostKeyChecking=yes"
          # The SSH options reach git only through this variable of git's own environment.
          git_keyed() {
            GIT_SSH_COMMAND="$ssh_command" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null git -C "$src" "$@"
          }
          git init -q "$src"
          git_keyed fetch -q --depth 1 ssh://git@github.com/park-kyungchan/ontology-platform "$pin"
          git_keyed checkout -q --detach FETCH_HEAD
          # The key leaves the disk and the environment before the first cargo process starts.
          rm -f -- "$key_file" "$known_hosts"
          unset ONTOLOGY_PLATFORM_DEPLOY_KEY GH_TOKEN ssh_command
          unset -f git_keyed
          if [ "$(git -C "$src" rev-parse HEAD)" != "$pin" ]; then
            echo "engine_checkout_differs@.github/workflows/rust.yml" >&2
            exit 1
          fi
          if [ -n "$(git -C "$src" status --porcelain)" ]; then
            echo "engine_worktree_dirty@.github/workflows/rust.yml" >&2
            exit 1
          fi
          # Build output lies outside the work tree, so the engine's revision stays the pin without a dirty mark.
          export CARGO_TARGET_DIR="$tmp/target"
          (cd "$src" && cargo build --locked --release -p ont)
          if [ -n "$(git -C "$src" status --porcelain)" ]; then
            echo "engine_worktree_dirty@.github/workflows/rust.yml" >&2
            exit 1
          fi
          mkdir -p "$HOME/engine-pin/bin"
          chmod 755 "$HOME/engine-pin" "$HOME/engine-pin/bin"
          install -m 755 "$CARGO_TARGET_DIR/release/ont" "$HOME/engine-pin/bin/ont"
      - name: Put the engine on PATH
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pin=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/ontology/ENGINE-PIN")
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "engine_pin_invalid@.github/workflows/rust.yml" >&2
            exit 1
          fi
          version=$("$HOME/engine-pin/bin/ont" --version 2>/dev/null || true)
          if [ "$version" != "ont 0.1.0 $pin" ]; then
            echo "engine_version_differs@.github/workflows/rust.yml" >&2
            exit 1
          fi
          echo "$version"
          echo "$HOME/engine-pin/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.scope.outputs.run_rust == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check
        if: steps.scope.outputs.run_rust == 'true'
        run: ./check
