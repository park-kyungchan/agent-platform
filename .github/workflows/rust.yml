name: Rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('rust-pr-{0}', github.ref) || format('rust-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply docs-only paths-ignore semantics inside the always-run job
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_rust=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':!docs/**' ':!README.md'; then
              run_rust=false
            fi
          fi
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
      - name: Check without a Rust build (documents only)
        if: steps.scope.outputs.run_rust != 'true'
        run: ./check content
      - name: Install repository-pinned Rust
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.scope.outputs.run_rust == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Read access to the engine repository
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        env:
          ONTOLOGY_PLATFORM_DEPLOY_KEY: ${{ secrets.ONTOLOGY_PLATFORM_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$ONTOLOGY_PLATFORM_DEPLOY_KEY" ]; then
            echo "deploy_key_missing@.github/workflows/rust.yml" >&2
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/ontology-platform-deploy-key"
          known_hosts="$RUNNER_TEMP/ontology-platform-known-hosts"
          printf '%s\n' "$ONTOLOGY_PLATFORM_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/meta > "$RUNNER_TEMP/github-meta.json"
          jq -r '.ssh_keys[]? | "github.com " + .' "$RUNNER_TEMP/github-meta.json" > "$known_hosts"
          rm -f "$RUNNER_TEMP/github-meta.json"
          if [ ! -s "$known_hosts" ]; then
            echo "github_ssh_keys_empty@.github/workflows/rust.yml" >&2
            exit 1
          fi
          git config --global url."ssh://git@github.com/park-kyungchan/ontology-platform".insteadOf https://github.com/park-kyungchan/ontology-platform
          git config --global core.sshCommand "ssh -i $key_file -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes"
      - name: Restore the engine of ontology/ENGINE-PIN (cargo install of ./check then builds nothing)
        if: steps.scope.outputs.run_rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/engine-pin/bin
            target/engine-pin/.crates.toml
            target/engine-pin/.crates2.json
          key: engine-pin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ontology/ENGINE-PIN', 'rust-toolchain.toml') }}
      - name: Check
        if: steps.scope.outputs.run_rust == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: ./check
      - name: Remove the deploy key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ontology-platform-deploy-key"
