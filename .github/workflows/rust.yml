name: Rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('rust-pr-{0}', github.ref) || format('rust-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply docs-only paths-ignore semantics inside the always-run job
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_rust=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':!docs/**' ':!README.md'; then
              run_rust=false
            fi
          fi
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
      - name: Check without a Rust build (documents only)
        if: steps.scope.outputs.run_rust != 'true'
        run: ./check content
      - name: Install repository-pinned Rust
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      - name: The engine of this tree
        id: rule
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The engine is named by the Git tree id of engine/ at HEAD (specs/ap/check.md R26), read as data.
          entry=$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false ls-tree HEAD -- engine)
          id=${entry#040000 tree }
          id=${id%$'\t'engine}
          if ! [[ "$entry" == "040000 tree "*$'\t'engine && "$id" =~ ^[0-9a-f]{40}$ ]]; then
            echo "engine_missing@.github/workflows/rust.yml: no engine/" >&2
            exit 1
          fi
          echo "tree=$id" >> "$GITHUB_OUTPUT"
      - name: Restore the engine of the tree of engine/
        id: tree-cache
        if: steps.scope.outputs.run_rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/engine-tree/bin
          key: engine-tree-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rule.outputs.tree }}
      - name: Build the engine of the tree of engine/
        if: steps.scope.outputs.run_rust == 'true' && steps.tree-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TREE_ID: ${{ steps.rule.outputs.tree }}
        run: |
          set -euo pipefail
          # engine/rust-toolchain.toml names the root's channel, installed above.
          # Built once per tree id: a pull request that does not touch engine/ restores it from the cache.
          (cd engine && CARGO_TARGET_DIR="$RUNNER_TEMP/engine-tree-target" ONT_TREE_ID="$TREE_ID" cargo build --locked --release -p ont)
          mkdir -p "$HOME/engine-tree/bin"
          chmod 755 "$HOME/engine-tree" "$HOME/engine-tree/bin"
          install -m 755 "$RUNNER_TEMP/engine-tree-target/release/ont" "$HOME/engine-tree/bin/ont"
      - name: Put the engine of the tree on PATH
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        env:
          TREE_ID: ${{ steps.rule.outputs.tree }}
        run: |
          set -euo pipefail
          version=$("$HOME/engine-tree/bin/ont" --version 2>/dev/null || true)
          read -r w1 w2 w3 extra <<<"$version" || true
          if [ "${w1:-}" != ont ] || [ -z "${w2:-}" ] || [ "${w3:-}" != "$TREE_ID" ] || [ -n "${extra:-}" ]; then
            echo "engine_version_differs@.github/workflows/rust.yml" >&2
            exit 1
          fi
          echo "$version"
          echo "$HOME/engine-tree/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.scope.outputs.run_rust == 'true'
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint
        if: steps.scope.outputs.run_rust == 'true'
        run: ./check lint
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply docs-only paths-ignore semantics inside the always-run job
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run_rust=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':!docs/**' ':!README.md'; then
              run_rust=false
            fi
          fi
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
      - name: Install repository-pinned Rust
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
      - name: The engine of this tree
        id: rule
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The engine is named by the Git tree id of engine/ at HEAD (specs/ap/check.md R26), read as data.
          entry=$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false ls-tree HEAD -- engine)
          id=${entry#040000 tree }
          id=${id%$'\t'engine}
          if ! [[ "$entry" == "040000 tree "*$'\t'engine && "$id" =~ ^[0-9a-f]{40}$ ]]; then
            echo "engine_missing@.github/workflows/rust.yml: no engine/" >&2
            exit 1
          fi
          echo "tree=$id" >> "$GITHUB_OUTPUT"
      - name: Restore the engine of the tree of engine/
        id: tree-cache
        if: steps.scope.outputs.run_rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/engine-tree/bin
          key: engine-tree-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rule.outputs.tree }}
      - name: Build the engine of the tree of engine/
        if: steps.scope.outputs.run_rust == 'true' && steps.tree-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TREE_ID: ${{ steps.rule.outputs.tree }}
        run: |
          set -euo pipefail
          # engine/rust-toolchain.toml names the root's channel, installed above.
          # Built once per tree id: a pull request that does not touch engine/ restores it from the cache.
          (cd engine && CARGO_TARGET_DIR="$RUNNER_TEMP/engine-tree-target" ONT_TREE_ID="$TREE_ID" cargo build --locked --release -p ont)
          mkdir -p "$HOME/engine-tree/bin"
          chmod 755 "$HOME/engine-tree" "$HOME/engine-tree/bin"
          install -m 755 "$RUNNER_TEMP/engine-tree-target/release/ont" "$HOME/engine-tree/bin/ont"
      - name: Put the engine of the tree on PATH
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        env:
          TREE_ID: ${{ steps.rule.outputs.tree }}
        run: |
          set -euo pipefail
          version=$("$HOME/engine-tree/bin/ont" --version 2>/dev/null || true)
          read -r w1 w2 w3 extra <<<"$version" || true
          if [ "${w1:-}" != ont ] || [ -z "${w2:-}" ] || [ "${w3:-}" != "$TREE_ID" ] || [ -n "${extra:-}" ]; then
            echo "engine_version_differs@.github/workflows/rust.yml" >&2
            exit 1
          fi
          echo "$version"
          echo "$HOME/engine-tree/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: steps.scope.outputs.run_rust == 'true'
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        if: steps.scope.outputs.run_rust == 'true'
        run: ./check test
      - name: The engine's steps when engine/ changed
        if: steps.scope.outputs.run_rust == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # ./check engine runs when the change touches engine/, or when there is no base to compare with
          # (absent or all zeros). engine/rust-toolchain.toml names the root's channel, installed above.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            changed=base_absent
          else
            changed=$(git diff --name-only "$BASE_SHA" HEAD -- engine)
          fi
          if [ -z "$changed" ]; then
            echo "engine/ unchanged: ./check engine not run"
            exit 0
          fi
          ./check engine
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: always()
    steps:
      - name: Both jobs succeeded
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "lint: $LINT_RESULT, test: $TEST_RESULT"
          [ "$LINT_RESULT" = success ] && [ "$TEST_RESULT" = success ]
