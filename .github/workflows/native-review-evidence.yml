name: Native review evidence
run-name: Native review evidence ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Native publisher correlation UUID
        required: true
        type: string
      head:
        description: Exact independently reviewed source head
        required: true
        type: string
      raw_base64:
        description: Unchanged native reviewer output, base64 encoded by its native publisher
        required: true
        type: string
permissions:
  contents: read
jobs:
  retain-native-review:
    if: ${{ github.actor_id == '241037670' && github.triggering_actor == 'park-kyungchan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retain external native output without creating a review
        env:
          REVIEW_HEAD: ${{ inputs.head }}
          REVIEW_RAW_BASE64: ${{ inputs.raw_base64 }}
        run: |
          python3 -I -S -B - <<'PY'
          import base64, json, os, pathlib, re
          head = os.environ['REVIEW_HEAD']
          if not re.fullmatch(r'[a-f0-9]{40}', head):
              raise SystemExit('native_review_head_required@.github/workflows/native-review-evidence.yml:35')
          raw = base64.b64decode(os.environ['REVIEW_RAW_BASE64'], validate=True)
          if not 0 < len(raw) <= 45000:
              raise SystemExit('native_review_raw_size@.github/workflows/native-review-evidence.yml:38')
          record = json.loads(raw)
          if record.get('headSha') != head or record.get('reviewStatus') != 'complete':
              raise SystemExit('native_review_raw_binding@.github/workflows/native-review-evidence.yml:41')
          pathlib.Path('native-review.json').write_bytes(raw)
          PY
      - name: Preserve unchanged native review output
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-review-${{ inputs.head }}
          path: native-review.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          include-hidden-files: false
