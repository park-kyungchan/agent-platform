name: Trusted source policy
run-name: Trusted source ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Native owner one-shot request UUID
        required: true
        type: string
      kind:
        description: Exact source subject kind
        required: true
        type: choice
        options: [pull-request, protected-main]
      pr:
        description: PR number, or zero for actual protected main
        required: true
        type: string
      head:
        description: Exact authored H
        required: true
        type: string
      base:
        description: Exact protected main B
        required: true
        type: string
      merge:
        description: Exact ordered prospective M or actual protected main merge
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: trusted-source-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  trusted-source:
    name: Trusted source controller
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Load immutable policy
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_REF" = refs/tags/trusted-ci-v1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(bun --version)" = 1.3.14
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          sudo chmod -R a-w "$GITHUB_WORKSPACE"
      - name: Observe isolated source checks
        id: controller
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_REQUEST_ID: ${{ inputs.request_id }}
          TRUSTED_KIND: ${{ inputs.kind }}
          TRUSTED_PR: ${{ inputs.pr }}
          TRUSTED_HEAD: ${{ inputs.head }}
          TRUSTED_BASE: ${{ inputs.base }}
          TRUSTED_MERGE: ${{ inputs.merge }}
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_REF_TYPE,GITHUB_REF_PROTECTED,GITHUB_REF,GITHUB_WORKSPACE,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_TOKEN,GITHUB_OUTPUT,TRUSTED_REQUEST_ID,TRUSTED_KIND,TRUSTED_PR,TRUSTED_HEAD,TRUSTED_BASE,TRUSTED_MERGE \
            "$(command -v bun)" --no-env-file --no-install "$GITHUB_WORKSPACE/ci/quality/trusted/controller.ts"
      - name: Upload controller evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.controller.outputs.report-path }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Upload controller observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trusted-source-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.controller.outputs.journal-path }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
