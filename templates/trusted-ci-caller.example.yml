# Native owner dispatch payload, not a workflow_call or a candidate-side status writer.
# The native installed issuer uses this schema after exact P/tag/actor/target qualification.
# POST /repos/park-kyungchan/agent-platform/actions/workflows/trusted-source.yml/dispatches
# X-GitHub-Api-Version: 2026-03-10
# Require HTTP 200 and workflow_run_id. Never infer the run from a 204 or retry a timeout.
ref: trusted-ci-v1
inputs:
  request_id: "<new-native-owner-UUIDv4>"
  kind: pull-request
  pr: "<exact-open-PR>"
  head: "<authored-H-full-SHA>"
  base: "<current-protected-main-B-full-SHA>"
  merge: "<provider-observed-ordered-M-full-SHA>"
# This is a data example. Keep source.yml and all existing required contexts active.
# No workflow_call support, App token, secret, new ruleset, merge or native activation is implied.
