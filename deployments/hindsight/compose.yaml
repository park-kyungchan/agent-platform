name: hindsight
services:
  postgres:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: unless-stopped
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_DB: hindsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  hindsight:
    image: ${HINDSIGHT_IMAGE:?Missing pinned Hindsight image}
    restart: unless-stopped
    stop_grace_period: 75s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HINDSIGHT_API_DATABASE_URL: ${HINDSIGHT_DATABASE_URL:?Missing database URL}
      HINDSIGHT_ENABLE_CP: "false"
      HINDSIGHT_API_LLM_PROVIDER: chatgpt
      HINDSIGHT_API_LLM_MODEL: gpt-6.1-terra
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:?Missing OpenAI API key}
      HINDSIGHT_API_LLM_PROMPT_CACHE_ENABLED: "false"
      HINDSIGHT_API_LLM_TIMEOUT: "120"
      HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "600"
      HINDSIGHT_API_LLM_REASONING_EFFORT: medium
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      HINDSIGHT_API_WORKER_ID: hindsight-vps-01
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_TENANT_API_KEY:?Missing service API key}
      HINDSIGHT_API_DB_POOL_MIN_SIZE: "1"
      HINDSIGHT_API_DB_POOL_MAX_SIZE: "10"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: "onnx"
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: "BAAI/bge-small-en-v1.5"
      HINDSIGHT_API_EMBEDDINGS_LOCAL_FORCE_CPU: "true"
      HINDSIGHT_API_RERANKER_PROVIDER: "onnx"
      HINDSIGHT_API_RERANKER_ONNX_MODEL_PATH: "/models/reranker/onnx/model_int8.onnx"
      HINDSIGHT_API_RERANKER_ONNX_TOKENIZER_NAME_OR_PATH: "/models/reranker"
      HINDSIGHT_API_RERANKER_ONNX_MODEL_ID: "onnx-community/bge-reranker-v2-m3-ONNX"
      HINDSIGHT_API_RERANKER_ONNX_MAX_TOKENS: "384"
      HINDSIGHT_API_RERANKER_ONNX_BATCH_SIZE: "2"
      HINDSIGHT_API_RERANKER_ONNX_THREADS: "2"
      HINDSIGHT_API_RERANKER_ONNX_MAX_CONCURRENT: "1"
      HINDSIGHT_API_RERANKER_ONNX_CPU_MEM_ARENA: "false"
      HINDSIGHT_API_RERANKER_ONNX_TIMEOUT: "180"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "40"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID: "80"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH: "300"
      HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_ID: "BAAI/bge-small-en-v1.5"
      HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_PATH: "/models/embedding/onnx/model.onnx"
      HINDSIGHT_API_EMBEDDINGS_ONNX_TOKENIZER_NAME_OR_PATH: "/models/embedding"
      HINDSIGHT_API_EMBEDDINGS_ONNX_DIMENSIONS: "384"
      HINDSIGHT_API_EMBEDDINGS_ONNX_POOLING: "cls"
      HINDSIGHT_API_EMBEDDINGS_ONNX_NORMALIZE: "true"
      HINDSIGHT_API_EMBEDDINGS_ONNX_QUERY_PREFIX: ""
      HINDSIGHT_API_EMBEDDINGS_ONNX_PASSAGE_PREFIX: ""
      HINDSIGHT_API_EMBEDDINGS_ONNX_BATCH_SIZE: "4"
      HINDSIGHT_API_EMBEDDINGS_ONNX_CPU_MEM_ARENA: "false"
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - hindsight-home:/home/hindsight/.hindsight
      - /docker/hindsight/models/bge-small-en-v1.5-onnx:/models/embedding:ro
      - /docker/hindsight/models/bge-reranker-v2-m3-onnx-int8:/models/reranker:ro
    networks:
      - database
      - hermes_frontend
networks:
  database:
    internal: true
  hermes_frontend:
    external: true
    name: hermes-agent-2q3y_frontend
volumes:
  postgres-data:
  hindsight-home:
