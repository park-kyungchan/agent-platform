# 2026-11-22: the user enters by plain ssh alone, as root with password and TOTP
# (00-00-password-totp.conf); herdr --remote and the retired herdr network are gone
# (the user's order, ap request act-rq-966eb833...). Kept in agent-vps-operations deployments/ssh/.
AllowUsers root
DisableForwarding yes
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
