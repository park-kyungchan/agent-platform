name: herdr-runtime

services:
  runtime:
    image: palantirkc/herdr-runtime:herdr-0.9.5-codex-0.163.0
    build:
      context: .
    platform: linux/amd64
    container_name: herdr-runtime
    hostname: srv1873899-herdr
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 1.5
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:2222:22/tcp"
    networks:
      default:
        ipv4_address: 172.16.4.2
    volumes:
      - type: bind
        source: /docker/herdr-runtime/home
        target: /home/palantirkc
        bind:
          create_host_path: false
      - type: bind
        source: /docker/herdr-runtime/ssh-host-keys
        target: /var/lib/herdr-ssh
        bind:
          create_host_path: false
      - type: bind
        source: /docker/herdr-runtime/authorized_keys
        target: /etc/ssh/authorized_keys/palantirkc
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run:size=16m,mode=0755
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/sbin/herdr-runtime-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.4.0/24
          gateway: 172.16.4.1
