# Tailscale Serve is the only ingress; Traefik binds to host loopback.
# Browser UI, auth and API share port 9119 and one cookie/refresh owner.
# Explicit Desktop API/WS requests retain the existing runtime on port 9120.
# X-Hermes-Runtime selects routing; existing authentication remains required.
# Root asset URLs and dashboard entry points redirect to canonical /hermes paths.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/local.crt
        keyFile: /certs/local.key
http:
  middlewares:
    hermes-home:
      redirectRegex:
        regex: ^https://([^/]+)/([?].*)?$
        replacement: https://${1}/hermes/sessions${2}
        permanent: false
    hermes-prefix:
      stripPrefix:
        prefixes:
        - /hermes
    hermes-static-prefix:
      redirectRegex:
        regex: ^https://([^/]+)/(.+)$
        replacement: https://${1}/hermes/${2}
        permanent: false
    hermes-landing:
      redirectRegex:
        regex: ^https://([^/]+)/hermes/?([?].*)?$
        replacement: https://${1}/hermes/sessions${2}
        permanent: false
  routers:
    hermes-home:
      rule: Path(`/`)
      entryPoints:
      - websecure
      priority: 200
      middlewares:
      - hermes-home
      service: hermes-dashboard
      tls: {}
    hermes:
      rule: Path(`/hermes`) || PathPrefix(`/hermes/`)
      entryPoints:
      - websecure
      middlewares:
      - hermes-prefix
      service: hermes-dashboard
      tls: {}
      priority: 200
    hermes-desktop:
      rule: (Path(`/hermes/api`) || PathPrefix(`/hermes/api/`)) && Header(`X-Hermes-Runtime`,
        `desktop`)
      entryPoints:
      - websecure
      priority: 300
      middlewares:
      - hermes-prefix
      service: hermes
      tls: {}
    hermes-static-assets:
      rule: PathPrefix(`/assets/`) || PathPrefix(`/fonts/`) || PathPrefix(`/fonts-terminal/`)
        || PathPrefix(`/ds-assets/`) || Path(`/favicon.ico`)
      entryPoints:
      - websecure
      priority: 200
      service: hermes-dashboard
      tls: {}
      middlewares:
      - hermes-static-prefix
    hermes-landing:
      rule: Path(`/hermes`) || Path(`/hermes/`)
      entryPoints:
      - websecure
      priority: 400
      middlewares:
      - hermes-landing
      service: hermes-dashboard
      tls: {}
  services:
    hermes-dashboard:
      loadBalancer:
        servers:
        - url: http://hermes-serve:9119
    hermes:
      loadBalancer:
        servers:
        - url: http://hermes-serve:9120
